name: Publish to PyPI

# Fires on a version tag push (e.g. `git tag v0.2.0 && git push origin v0.2.0`). Uses PyPI's
# Trusted Publisher OIDC flow instead of a stored API token — nothing to rotate or leak. Before
# the first release, register this workflow as a trusted publisher for the `yt-music-tui-py`
# project at https://pypi.org/manage/account/publishing/ (repo owner/name, workflow filename
# "publish.yml", environment "pypi" — matching this file exactly).
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/yt-music-tui-py
    permissions:
      id-token: write # required for Trusted Publishing — no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
