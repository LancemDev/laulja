[project]
name = "laulja"
version = "0.2.0"
description = "A terminal UI for YouTube Music — real playback, a live FFT bar visualizer, synced lyrics, and YouTube Music radio/mix."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lance Munyao", email = "lancemunyao@gmail.com" }]
keywords = ["youtube-music", "tui", "terminal", "music-player", "textual"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=0.58",
    "textual-image>=0.13",
    "pyfiglet>=1.0",
    "ytmusicapi>=1.8",
    "yt-dlp>=2024.8.6",
    "numpy>=1.26",
    "cryptography>=42",
    "httpx>=0.27",
    "sounddevice>=0.4",
]

[project.urls]
Homepage = "https://github.com/LancemDev/laulja"
Repository = "https://github.com/LancemDev/laulja"
Issues = "https://github.com/LancemDev/laulja/issues"

[project.scripts]
laulja = "laulja.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["laulja*"]
